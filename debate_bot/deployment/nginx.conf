# Load balancer for the debate-node replicas (T4). Mounted as the full
# /etc/nginx/nginx.conf (not a conf.d fragment) so we can pin worker_processes.
#
# worker_processes 1 is deliberate: nginx's round-robin counter is per-worker,
# not shared across workers. With the stock image's `worker_processes auto`
# (one per CPU core) and light demo traffic, each request can land on a fresh
# idle worker that always starts its own counter at server 1 — round-robin
# looks broken (every request hits node-1) even though it isn't. A single
# worker is what makes `curl` in a loop actually cycle node-1/2/3 as expected.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # SSE needs all four of the proxy directives below or the stream silently
    # buffers through the proxy and only flushes at connection close instead
    # of arriving incrementally.
    upstream debate_nodes {
        server node-1:8000;
        server node-2:8000;
        server node-3:8000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://debate_nodes;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
