# Optional — requires an ingress-nginx controller in the cluster
# (kind: https://kind.sigs.k8s.io/docs/user/ingress/). Without this, use
# `kubectl port-forward svc/debate-node 8080:8000` instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debate-node
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debate-node
                port:
                  number: 8000
